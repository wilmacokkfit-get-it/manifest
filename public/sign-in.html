<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>Owner sign in · MANIFEST</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=6">
  <style>
    .owner-auth { min-height: 100vh; display: grid; place-items: center; padding: 48px 20px; }
    .owner-auth-card { width: min(100%, 480px); text-align: center; }
    .owner-auth-brand { color: #e8dcc3; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; letter-spacing: .2em; font-size: 12px; margin-bottom: 42px; }
    .owner-auth-brand img { width: 26px; height: 26px; }
    .owner-auth-card h1 { font: 500 clamp(30px, 5vw, 42px)/1.1 "Playfair Display", Georgia, serif; margin: 0 0 12px; }
    .owner-auth-intro { color: #aaa69e; line-height: 1.7; margin: 0 auto 28px; max-width: 390px; font-size: 14px; }
    .owner-auth-widget { min-height: 360px; display: flex; justify-content: center; }
    .auth-status { min-height: 24px; color: #aaa69e; font-size: 13px; line-height: 1.6; }
    .auth-status.error { color: #f0a28f; }
    .auth-status.owner { color: #d8bc86; }
    .owner-auth-back { display: inline-block; color: #aaa69e; font-size: 12px; margin-top: 12px; text-decoration: none; }
    .owner-auth-back:hover { color: #e8dcc3; }
    .owner-sign-out { display: block; margin: 12px auto; color: #aaa69e; background: transparent; border: 0; cursor: pointer; font: inherit; font-size: 12px; }
  </style>
</head>
<body data-auth-page="sign-in">
  <main class="owner-auth">
    <section class="owner-auth-card">
      <a class="owner-auth-brand" href="/" aria-label="MANIFEST home"><img src="/favicon.svg" alt="">MANIFEST</a>
      <h1>Owner sign in</h1>
      <p class="owner-auth-intro">Sign in to manage your owner access. The rest of MANIFEST remains open to everyone without an account.</p>
      <div class="owner-auth-widget" data-owner-auth></div>
      <p class="auth-status" data-auth-status role="status" aria-live="polite">Loading secure sign-in…</p>
      <button class="owner-sign-out" data-owner-sign-out type="button" hidden>Sign out</button>
      <a class="owner-auth-back" href="/">← Back to MANIFEST</a>
    </section>
  </main>
  <script src="/owner-auth.js" defer></script>
</body>
</html>
